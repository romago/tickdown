version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: tickdown-mongo
    restart: unless-stopped
    # MongoDB NOT exposed to host — only reachable inside tickdown_network
    expose:
      - "27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-tickdown}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-tickdown}
    volumes:
      - mongo_data:/data/db
    networks:
      - tickdown_network

  backend:
    build: ./backend
    container_name: tickdown-backend
    restart: unless-stopped
    # Bound to 127.0.0.1 only — not reachable from outside the server
    ports:
      - "127.0.0.1:${API_PORT:-5010}:5000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://${MONGO_USER:-tickdown}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB:-tickdown}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PORT: 5000
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      DEMO_EMAIL: ${DEMO_EMAIL:-}
    depends_on:
      - mongo
    networks:
      - tickdown_network

  frontend:
    build: ./frontend
    container_name: tickdown-frontend
    restart: unless-stopped
    # Bound to 127.0.0.1 only — not reachable from outside the server
    ports:
      - "127.0.0.1:${WEB_PORT:-3010}:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - tickdown_network

volumes:
  mongo_data:

networks:
  tickdown_network:
    driver: bridge
